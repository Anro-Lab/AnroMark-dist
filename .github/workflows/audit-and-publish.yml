name: audit-and-publish

on:
  repository_dispatch:
    types: [audit_release]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to audit and publish (must be an existing draft release)'
        required: true
        type: string
      dry_run:
        description: 'Audit only — never create/publish anything in dist'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  issues: write
  actions: read

concurrency:
  group: audit-and-publish-${{ github.event.client_payload.tag || inputs.tag }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 4  # ~3x the longest of the last 30 runs (66s)
    env:
      TAG: ${{ github.event.client_payload.tag || inputs.tag }}
      SRC_REPO: Anro-Lab/AnroMark-win
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Validate inputs
        env:
          REQUESTED_DRY_RUN: ${{ github.event.client_payload.dry_run || inputs.dry_run || false }}
        run: |
          # Resolved once, here, and written unconditionally to $GITHUB_ENV — DRY_RUN
          # is deliberately NOT also declared as a job-level env var (a job-level env
          # entry would compete with this $GITHUB_ENV write for the same name in later
          # steps), so the "-"-suffixed-tag safety net below cannot be silently discarded.
          # It is written BEFORE the tag checks below: if a check rejects the tag, the
          # FAIL step must still see the caller's dry_run, or a dry run with a bad tag
          # would open a real issue on the source repo.
          DRY="${REQUESTED_DRY_RUN}"
          if printf '%s' "${TAG:-}" | grep -q -- '-'; then
            DRY=true
            echo "::notice::tag ${TAG} looks like a pre-release/test tag; forcing dry_run=true regardless of caller"
          fi
          echo "DRY_RUN=${DRY}" >> "$GITHUB_ENV"
          if [ -z "${TAG:-}" ]; then
            echo "::error::no tag supplied via client_payload.tag or inputs.tag"
            exit 1
          fi
          case "${TAG}" in
            v[0-9]*.[0-9]*.[0-9]*) : ;;
            *) echo "::error::refusing unexpected tag shape: ${TAG}"; exit 1 ;;
          esac
          echo "auditing tag=${TAG} src=${SRC_REPO} dry_run=${DRY}"

      - name: Guard - check audit self-test status (fail-closed)
        run: |
          set -u
          # Fail-closed: only a completed run with conclusion "success" passes.
          # A gh error, no completed run, or an empty result all refuse to publish.
          if ! conclusion=$(gh run list \
              --repo "${{ github.repository }}" \
              --workflow audit-self-test.yml \
              --status completed \
              --limit 1 \
              --json conclusion \
              --jq '.[0].conclusion // ""'); then
            echo "::error::could not read the audit-self-test status (gh run list failed); refusing to publish"
            exit 1
          fi
          echo "last completed audit-self-test conclusion: '${conclusion}'"
          if [ "${conclusion}" != "success" ]; then
            echo "::error::audit-self-test is not green (conclusion='${conclusion}', empty = no completed run); refusing to publish"
            exit 1
          fi

      - name: Checkout dist repo (for audit-rules)
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Download release assets from AnroMark-win
        env:
          GH_TOKEN: ${{ secrets.WIN_REPO_TOKEN }}
        run: |
          set -u
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::WIN_REPO_TOKEN secret missing — cannot read ${SRC_REPO} releases"; exit 1; }
          isdraft=$(gh release view "${TAG}" --repo "${SRC_REPO}" --json isDraft --jq '.isDraft') \
            || { echo "::error::no release ${TAG} on ${SRC_REPO}"; exit 1; }
          if [ "${isdraft}" != "false" ]; then
            echo "::error::${SRC_REPO} release ${TAG} is still a draft (draft assets are mutable); refusing"
            exit 1
          fi
          mkdir -p ./_dl
          gh release download "${TAG}" --repo "${SRC_REPO}" -D ./_dl --clobber
          gh release view "${TAG}" --repo "${SRC_REPO}" --json body --jq '.body' > ./_notes.md
          [ -s ./_notes.md ] || printf 'AnroMark %s\n' "${TAG}" > ./_notes.md
          echo "downloaded files:"
          ls -la ./_dl

      - name: Unpack zip
        id: unpack
        run: |
          set -u
          mkdir -p ./_unpack
          zipfile=$(find ./_dl -maxdepth 1 -type f -name 'AnroMark-v*-win32-x64.zip' | head -1)
          for want in 'AnroMark-v*-win32-x64.exe' 'AnroMark-v*-win32-x64-portable.exe' 'latest.yml'; do
            [ -n "$(find ./_dl -maxdepth 1 -type f -name "$want" | head -1)" ] || { echo "::error::missing asset ${want}"; exit 1; }
          done
          if [ -z "$zipfile" ]; then
            echo "::error::no zip asset found in release ${TAG}"
            exit 1
          fi
          new_size=$(stat -c '%s' "$zipfile" 2>/dev/null || stat -f '%z' "$zipfile")
          echo "zipfile=$zipfile new_size=$new_size"
          echo "new_size=$new_size" >> "$GITHUB_OUTPUT"
          unzip -q "$zipfile" -d ./_unpack || { rc=$?; [ $rc -le 1 ] || exit $rc; }

      - name: Resolve baseline release size
        id: baseline
        run: |
          set -u
          # Find previous published (non-draft, non-prerelease) release excluding current tag.
          # Sorted by semantic version (not createdAt): a batch of historical releases were
          # backfilled with an identical createdAt timestamp, which made sort_by(.createdAt)
          # | reverse pick the OLDEST member of that tied group instead of the true latest
          # (e.g. resolved to v0.10.20 instead of v0.10.30), causing false size-policy failures.
          # Only app releases count: tags must be exactly vX.Y.Z. This ignores the
          # hand-uploaded runtime tags (llama-runtime-*, ollama-runtime-*) and -test.N
          # prereleases; before this filter the resolver broke on runtime tags and
          # the size gate was silently skipped. -L 100 keeps old releases in range.
          # A gh or jq error fails the step; it is never swallowed into "no baseline".
          if ! releases=$(gh release list --repo "${{ github.repository }}" -L 100 \
              --json tagName,isDraft,isPrerelease); then
            echo "::error::baseline lookup failed: gh release list errored on ${{ github.repository }}"
            exit 1
          fi
          if ! baseline=$(printf '%s' "$releases" | jq -r --arg tag "${TAG}" '
              [.[] | select(.isDraft==false and .isPrerelease==false and .tagName!=$tag
                            and (.tagName | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$")))]
              | map(. + {ver: (.tagName | ltrimstr("v") | split(".") | map(tonumber))})
              | sort_by(.ver) | reverse | .[0].tagName // empty'); then
            echo "::error::baseline lookup failed: jq could not select a baseline release"
            exit 1
          fi
          if [ -z "$baseline" ]; then
            echo "::warning::no baseline release found for ${TAG}; size policy will use its no-baseline setting"
            echo "baseline_size=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Baseline size comes from the Windows zip asset only.
          asset="AnroMark-${baseline}-win32-x64.zip"
          if ! assets=$(gh release view "$baseline" --repo "${{ github.repository }}" --json assets); then
            echo "::error::baseline lookup failed: gh release view ${baseline} errored"
            exit 1
          fi
          if ! size=$(printf '%s' "$assets" | jq -r --arg n "$asset" \
              '[.assets[] | select(.name==$n) | .size] | first // empty'); then
            echo "::error::baseline lookup failed: jq could not read the size of ${asset}"
            exit 1
          fi
          if [ -z "$size" ]; then
            echo "::warning::baseline ${baseline} has no asset ${asset}; size policy will use its no-baseline setting"
          fi
          echo "baseline=$baseline asset=$asset size=${size:-none}"
          echo "baseline_size=${size:-}" >> "$GITHUB_OUTPUT"

      - name: Run audit
        id: audit
        uses: ./.github/actions/run-audit
        with:
          unpack-dir: ./_unpack
          baseline-size: ${{ steps.baseline.outputs.baseline_size }}
          new-size: ${{ steps.unpack.outputs.new_size }}
          require-integrity: 'true'

      - name: Publish to dist (PASS path)
        if: steps.audit.outputs.result == 'PASS'
        run: |
          set -u
          REPO="${{ github.repository }}"
          if [ "${DRY_RUN}" = "true" ]; then
            echo "::notice::DRY RUN — audit PASSED for ${TAG}; would publish $(ls ./_dl | tr '\n' ' ') to ${REPO}"
            exit 0
          fi
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release upload "${TAG}" --repo "${REPO}" --clobber ./_dl/*
            gh release edit   "${TAG}" --repo "${REPO}" --notes-file ./_notes.md --draft=false
          else
            gh release create "${TAG}" --repo "${REPO}" \
              --target "${{ github.sha }}" \
              --draft \
              --title "${TAG}" \
              --notes-file ./_notes.md \
              ./_dl/*
            gh release edit "${TAG}" --repo "${REPO}" --draft=false
          fi
          echo "::notice::published ${TAG} to ${REPO}"

      - name: Cleanup + alert (FAIL path)
        # Runs when any earlier step failed (e.g. win release missing, download error)
        # and also when the audit finished with a non-PASS result.
        if: failure() || (success() && steps.audit.outputs.result != 'PASS')
        env:
          AUDIT_RESULT: ${{ steps.audit.outputs.result }}
          AUDIT_REASON: ${{ steps.audit.outputs.reason }}
          WIN_TOKEN: ${{ secrets.WIN_REPO_TOKEN }}
        run: |
          set -u
          REPO="${{ github.repository }}"
          TAG="${TAG:-<none>}"
          # The audit's reason is empty on PASS, so a failure after a PASS can only be
          # the publish step; anything else without a reason failed before the audit.
          if [ "${AUDIT_RESULT}" = "PASS" ]; then
            REASON="the audit passed, but publishing to dist failed (see the run log)"
            NEXT="A ${TAG} draft left on AnroMark-dist by the failed publish is deleted by this step; a ${TAG} release that was already public is left as it is, so check its assets. Then re-run: \`gh workflow run audit-and-publish.yml --repo ${REPO} -f tag=${TAG}\`."
          else
            REASON="${AUDIT_REASON:-a step before the audit failed (see the run log)}"
            NEXT="Nothing was published to AnroMark-dist. Fix the artifact, then re-cut the release on AnroMark-win (or re-run: \`gh workflow run audit-and-publish.yml --repo ${REPO} -f tag=${TAG}\`)."
          fi
          echo "::error::audit FAIL reason=${REASON} tag=${TAG}"

          if [ "${DRY_RUN:-false}" = "true" ]; then
            echo "::warning::DRY RUN — audit FAILed for ${TAG}; leaving dist untouched (no delete), suppressing issue notification"
            exit 1
          fi

          case "${TAG}" in
            v[0-9]*.[0-9]*.[0-9]*)
              state=$(gh release view "${TAG}" --repo "${REPO}" --json isDraft --jq '.isDraft' 2>/dev/null || echo missing)
              if [ "${state}" = "true" ]; then
                gh release delete "${TAG}" --repo "${REPO}" --cleanup-tag --yes || true
              else
                echo "no dist draft to clean up (state=${state})"
              fi ;;
            *) echo "no valid tag; skipping dist draft cleanup" ;;
          esac

          body=$(printf 'Dist audit gate rejected `%s`.\n\nReason: `%s`\n\nAudit run: %s/%s/actions/runs/%s\nSource release: %s/%s/releases/tag/%s\n\n%s' \
            "${TAG}" "${REASON}" \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}" \
            "${{ github.server_url }}" "${SRC_REPO}" "${TAG}" "${NEXT}")

          if [ -n "${WIN_TOKEN:-}" ]; then
            GH_TOKEN="${WIN_TOKEN}" gh issue create --repo "${SRC_REPO}" \
              --title "Audit FAIL on ${TAG}" --body "${body}" \
              || echo "::error::failed to open issue on ${SRC_REPO} (check WIN_REPO_TOKEN issues:write)"
          else
            echo "::error::WIN_REPO_TOKEN unset — no issue opened on ${SRC_REPO}"
          fi
          exit 1
