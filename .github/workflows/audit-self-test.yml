name: audit-self-test

on:
  push:
    paths:
      - 'audit-rules/**'
      - '.github/workflows/audit-*.yml'
      - '.github/actions/run-audit/**'
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  size-policy-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 3  # ~3x the longest of the last 30 workflow runs (46s)
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
      - name: Run size_policy_test.sh
        run: bash audit-rules/size_policy_test.sh

  metamorphic:
    runs-on: ubuntu-latest
    timeout-minutes: 3  # ~3x the longest of the last 30 workflow runs (46s)
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: clean-fixture
            zip: audit-rules/fixtures/clean-fixture.zip
            expected: PASS
          - name: dirty-service-account
            zip: audit-rules/fixtures/dirty-service-account.zip
            expected: FAIL
          - name: dirty-ts-source
            zip: audit-rules/fixtures/dirty-ts-source.zip
            expected: FAIL
          - name: dirty-env
            zip: audit-rules/fixtures/dirty-env.zip
            expected: FAIL
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - name: Unpack fixture
        id: unpack
        run: |
          set -u
          mkdir -p ./_unpack
          unzip -q "${{ matrix.zip }}" -d ./_unpack || { rc=$?; [ $rc -le 1 ] || exit $rc; }
          new_size=$(stat -c '%s' "${{ matrix.zip }}" 2>/dev/null || stat -f '%z' "${{ matrix.zip }}")
          echo "new_size=$new_size" >> "$GITHUB_OUTPUT"

      - name: Run audit
        id: audit
        uses: ./.github/actions/run-audit
        with:
          unpack-dir: ./_unpack
          baseline-size: ''
          new-size: ${{ steps.unpack.outputs.new_size }}
          require-integrity: ${{ matrix.name == 'clean-fixture' && 'true' || 'false' }}

      - name: Verify metamorphic invariant
        env:
          GOT: ${{ steps.audit.outputs.result }}
          EXPECTED: ${{ matrix.expected }}
          NAME: ${{ matrix.name }}
        run: |
          set -u
          echo "fixture=${NAME} expected=${EXPECTED} got=${GOT}"
          if [ "${GOT}" != "${EXPECTED}" ]; then
            echo "::error::INVARIANT VIOLATED for ${NAME}: expected ${EXPECTED}, got ${GOT}"
            exit 1
          fi

  alarm-on-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs: [metamorphic, size-policy-unit]
    if: failure()
    env:
      # The alarm issue lives on AnroMark-win, so it needs the cross-repo token
      # (the dist GITHUB_TOKEN cannot open issues there).
      GH_TOKEN: ${{ secrets.WIN_REPO_TOKEN }}
    steps:
      - name: Open alarm issue
        run: |
          set -u
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::WIN_REPO_TOKEN secret missing - cannot open the alarm issue"; exit 1; }
          body=$(printf 'audit-self-test failed in dist repo. A metamorphic invariant was violated, meaning the audit gate is no longer trustworthy.\n\nWorkflow run: %s/%s/actions/runs/%s\n\n`audit-and-publish` will refuse to publish anything until self-test passes again.' \
            "${{ github.server_url }}" "${{ github.repository }}" "${{ github.run_id }}")
          # No --label: AnroMark-win has no "critical" label, and a missing label
          # would make this create fail. A failed create now fails the job loudly.
          gh issue create \
            --repo Anro-Lab/AnroMark-win \
            --title "AUDIT-WORKFLOW-BROKEN dist repo alarm" \
            --body "${body}"
